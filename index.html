<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1008">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Allenamenti">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Scheda allenamenti</title>
<style>
@property --h{syntax:"<number>";inherits:true;initial-value:24}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1);transition:--h .9s var(--ease);
--l1:86%;--l2:72%;--glow:hsl(calc(var(--h) + 30) 90% 92% / .6);
--tx:#1b130b;--sec:rgba(27,19,11,.6);--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.78);--sep:rgba(27,19,11,.12);--ink:#fff;--ac:hsl(var(--h) 70% 26%);--red:#c8281e;--bar:rgba(255,255,255,.55);--thumb:rgba(255,255,255,.92)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--l1:30%;--l2:11%;--glow:hsl(calc(var(--h) + 25) 80% 50% / .28);--tx:#fff;--sec:rgba(255,255,255,.62);--glass:rgba(255,255,255,.11);--glass2:rgba(255,255,255,.2);--sep:rgba(255,255,255,.14);--ink:hsl(var(--h) 45% 14%);--ac:hsl(var(--h) 100% 88%);--red:#ff7a70;--bar:rgba(20,14,10,.35);--thumb:rgba(255,255,255,.26)}}
:root[data-theme="dark"]{color-scheme:dark;--l1:30%;--l2:11%;--glow:hsl(calc(var(--h) + 25) 80% 50% / .28);--tx:#fff;--sec:rgba(255,255,255,.62);--glass:rgba(255,255,255,.11);--glass2:rgba(255,255,255,.2);--sep:rgba(255,255,255,.14);--ink:hsl(var(--h) 45% 14%);--ac:hsl(var(--h) 100% 88%);--red:#ff7a70;--bar:rgba(20,14,10,.35);--thumb:rgba(255,255,255,.26)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:hsl(var(--h) 45% var(--l2));-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 55% at 85% -5%,var(--glow),transparent 62%),linear-gradient(165deg,hsl(var(--h) 48% var(--l1)),hsl(calc(var(--h) + 16) 52% var(--l2)))}
main{max-width:560px;margin:0 auto;padding:18px 22px 120px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(calc(var(--dx)*34px)) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.enter [data-r]{animation:rise .75s var(--ease) both;animation-delay:calc(min(var(--i),14)*45ms)}
.t,h1{font-size:30px;font-weight:700;line-height:1.1;margin:0;letter-spacing:-.01em}
h1{font-size:34px;margin:8px 0 18px}
.side [data-r]{animation-name:slide}
.side .seg{animation:none}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 4px 14px}
.hd h1{margin:0}
.cnt{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;background:var(--glass2);border-radius:99px;padding:7px 14px;white-space:nowrap;transition:background .4s,color .4s}
.cnt.full{background:var(--tx);color:var(--ink)}
.scr{margin:0 4px}
.trk{height:8px;border-radius:99px;background:var(--glass2);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px;background:var(--tx);transform-origin:left;transform:scaleX(0);transition:transform .9s var(--ease)}
.seg{position:relative;display:flex;background:var(--glass);border-radius:14px;padding:3px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.seg::-webkit-scrollbar{display:none}
.th{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:11px;background:var(--thumb);box-shadow:0 4px 12px rgba(0,0,0,.14);transition:transform .55s var(--ease),width .55s var(--ease)}
.seg button{position:relative;z-index:1;flex:1 0 auto;min-width:76px;padding:9px 14px;font-size:15px;font-weight:600;white-space:nowrap;border-radius:11px;color:var(--sec);transition:color .3s}
.seg button.on{color:var(--tx)}
.card{background:var(--glass);border-radius:22px;overflow:hidden;margin-bottom:20px;-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%)}
.rw{position:relative;display:flex;align-items:center;gap:15px;width:100%;text-align:left;padding:14px 18px;transition:background .25s,transform .4s var(--ease)}
.rw+.rw::before{content:"";position:absolute;left:61px;right:0;top:0;height:.5px;background:var(--sep)}
.rw:active{background:var(--glass);transform:scale(.985)}
.ck{width:28px;height:28px;border-radius:50%;border:1.8px solid var(--sec);flex:none;display:grid;place-items:center;transition:background .3s,border-color .3s}
.ck.on{background:var(--tx);border-color:var(--tx);animation:pop .5s var(--spring)}
.ck svg{width:16px;height:16px;stroke:var(--ink)}
.ck path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s .1s var(--ease)}
.ck.on path{stroke-dashoffset:0}
.tx{display:flex;flex-direction:column;min-width:0}
.tx b{font-weight:600;transition:opacity .35s,transform .35s var(--ease)}
.tx small{color:var(--sec);font-size:15px}
.rw.dn .tx b{opacity:.5}
.empty{padding:22px 18px;color:var(--sec);text-align:center}
.foot{display:flex;justify-content:space-between;align-items:center;margin:-6px 6px 0;color:var(--sec);font-size:14px}
.link{color:var(--ac);font-size:15px;font-weight:500;transition:opacity .2s}
.link:active{opacity:.5}
.link.red{color:var(--red)}
.gh{margin:0 8px 8px;font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.fld{display:block;width:100%;background:transparent;border:0;padding:14px 18px;outline:0;border-radius:0}
.fld.sm{font-size:15px;color:var(--sec)}
.fld::placeholder{color:var(--sec);opacity:.7}
.blk+.blk{border-top:.5px solid var(--sep)}
.blk .fld+.fld{border-top:.5px solid var(--sep)}
.acts{display:flex;gap:18px;padding:11px 18px;border-top:.5px solid var(--sep)}
.acts .r{margin-left:auto}
.acts button:disabled{opacity:.3}
.pill{display:block;width:100%;background:var(--tx);color:var(--ink);font-weight:700;border-radius:99px;padding:16px;text-align:center;transition:transform .4s var(--spring),background .3s}
.pill:active{transform:scale(.97)}
.pill.red{background:var(--red);color:#fff}
.btnrow{display:block;width:100%;text-align:left;padding:15px 18px;color:var(--tx);font-weight:500;transition:background .25s}
.btnrow:active{background:var(--glass)}
.btnrow+.btnrow{border-top:.5px solid var(--sep)}
.btnrow.red{color:var(--red)}
.bot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);padding:8px 0 env(safe-area-inset-bottom,0px);z-index:5}
.bot button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--sec);padding:4px 0;transition:color .3s,transform .4s var(--spring)}
.bot button:active{transform:scale(.9)}
.bot svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bot button.on{color:var(--tx)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="bot" id="bar"></nav>
<script>
const K="scheda-allenamenti-v1";
const HUES=[24,205,335,150,275,45];
const uid=()=>Math.random().toString(36).slice(2,9);
const ex=(n,d)=>({id:uid(),name:n,detail:d});
const def=()=>{const a={id:uid(),name:"Giorno A",exercises:[ex("Squat","4×8 · esempio, modificami"),ex("Panca piana","4×8"),ex("Rematore","4×10")]},
b={id:uid(),name:"Giorno B",exercises:[ex("Stacco rumeno","4×8"),ex("Military press","3×10"),ex("Trazioni","3×max")]},
c={id:uid(),name:"Giorno C",exercises:[ex("Affondi","3×12"),ex("Dip","3×max"),ex("Plank","3×45″")]};
return{active:a.id,days:[a,b,c],checks:{}}};
function clean(s){
  if(!s||!Array.isArray(s.days)||!s.days.length)return null;
  const days=s.days.map(d=>({id:String(d&&d.id||uid()),name:String(d&&d.name||"Giorno"),exercises:(Array.isArray(d&&d.exercises)?d.exercises:[]).map(x=>({id:String(x&&x.id||uid()),name:String(x&&x.name||""),detail:String(x&&x.detail||"")}))}));
  const checks={};
  if(s.checks&&typeof s.checks==="object")for(const k in s.checks){const v=s.checks[k];if(v&&typeof v==="object"){const o={};for(const i in v)if(v[i])o[i]=true;if(Object.keys(o).length)checks[k]=o}}
  return{active:days.some(d=>d.id===s.active)?s.active:days[0].id,days,checks};
}
let S=null;
try{S=clean(JSON.parse(localStorage.getItem(K)))}catch(e){}
if(!S)S=def();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=iso(new Date());
let cur=today,mode="today",armDel=null,anim=true,dx=0,lastTh=null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const day=()=>S.days.find(d=>d.id===S.active)||(S.active=S.days[0].id,S.days[0]);
const CK=`<svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const seg=(d,plus)=>`<div class="seg" data-r><i class="th"></i>`+S.days.map(x=>`<button class="${x.id===d.id?"on":""}" data-a="tab" data-id="${x.id}">${esc(x.name)}</button>`).join("")+(plus?`<button data-a="addday" aria-label="Aggiungi giorno" style="min-width:48px;font-size:22px">+</button>`:"")+`</div>`;
function viewToday(d){
  const L=d.exercises,chk=S.checks[cur]||{};
  let h=seg(d,false);
  h+=`<div class="hd" data-r><h1>${esc(d.name)}</h1><span id="rc" class="cnt"></span></div>`;
  h+=`<div class="scr" data-r><div class="trk"><i id="pf"></i></div></div>`;
  h+=`<div class="card" style="margin-top:22px">`;
  if(!L.length)h+=`<div class="empty" data-r>Nessun esercizio. Vai su Modifica per aggiungerne.</div>`;
  L.forEach(e=>{const on=!!chk[e.id];
    h+=`<button class="rw ${on?"dn":""}" data-r data-a="tog" data-id="${e.id}" aria-pressed="${on}"><span class="ck ${on?"on":""}">${CK}</span><span class="tx"><b>${esc(e.name)}</b>${e.detail?`<small>${esc(e.detail)}</small>`:""}</span></button>`});
  h+=`</div><div class="foot" data-r style="justify-content:center"><button class="link red" data-a="reset">Azzera spunte</button></div>`;
  return h;
}
function prog(){
  const g=i=>document.getElementById(i);if(!g("rc"))return;
  const L=day().exercises,chk=S.checks[cur]||{},n=L.filter(e=>chk[e.id]).length,p=L.length?n/L.length:0,full=L.length>0&&n===L.length;
  g("pf").style.transform="scaleX("+p+")";
  g("rc").textContent=full?"✓ Fatto":n+"/"+L.length;
  g("rc").classList.toggle("full",full);
}
function viewEdit(d){
  let h=`<h1 data-r>Modifica</h1>`+seg(d,true);
  h+=`<div class="gh" data-r>Nome del giorno</div><div class="card" data-r><input class="fld" data-f="dayname" value="${esc(d.name)}" aria-label="Nome del giorno"></div>`;
  h+=`<div class="gh" data-r>Esercizi</div><div class="card" data-r>`;
  if(!d.exercises.length)h+=`<div class="empty">Ancora nessun esercizio.</div>`;
  d.exercises.forEach((e,i)=>{
    h+=`<div class="blk"><input class="fld" data-f="name" data-id="${e.id}" value="${esc(e.name)}" placeholder="Esercizio"><input class="fld sm" data-f="detail" data-id="${e.id}" value="${esc(e.detail)}" placeholder="Serie, ripetizioni, carico…"><div class="acts"><button class="link" data-a="up" data-id="${e.id}" ${i===0?"disabled":""}>Sposta su</button><button class="link" data-a="down" data-id="${e.id}" ${i===d.exercises.length-1?"disabled":""}>Sposta giù</button><button class="link red r" data-a="rm" data-id="${e.id}">Elimina</button></div></div>`;
  });
  h+=`</div><div class="gh" data-r>Aggiungi esercizio</div><div class="card" data-r><input class="fld" id="nn" placeholder="Nome"><div class="blk" style="border-top:.5px solid var(--sep)"><input class="fld sm" id="nd" placeholder="Serie, ripetizioni, carico…"></div></div><button class="pill" data-r data-a="add">Aggiungi</button>`;
  if(S.days.length>1)h+=`<div style="height:20px"></div><div class="card" data-r><button class="btnrow red" data-a="delday">${armDel===d.id?"Tocca ancora per eliminare “"+esc(d.name)+"”":"Elimina questo giorno"}</button></div>`;
  return h;
}
const app=document.getElementById("app"),bar=document.getElementById("bar");
const ICON={today:`<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>`,edit:`<path d="M4 7h16M4 12h16M4 17h10"/>`};
bar.innerHTML=[["today","Oggi"],["edit","Modifica"]].map(([m,l])=>`<button data-a="mode" data-m="${m}"><svg viewBox="0 0 24 24">${ICON[m]}</svg>${l}</button>`).join("");
function thumb(){
  const s=app.querySelector(".seg");if(!s)return;
  const b=s.querySelector("button.on"),t=s.querySelector(".th");if(!b||!t)return;
  const set=(l,w)=>{t.style.transform="translateX("+l+"px)";t.style.width=w+"px"};
  s.scrollLeft=Math.max(0,b.offsetLeft-(s.clientWidth-b.offsetWidth)/2);
  if(!lastTh){t.style.transition="none";set(b.offsetLeft,b.offsetWidth);t.getBoundingClientRect();t.style.transition=""}
  else{t.style.transition="none";set(lastTh.l,lastTh.w);t.getBoundingClientRect();t.style.transition="";requestAnimationFrame(()=>set(b.offsetLeft,b.offsetWidth))}
  lastTh={l:b.offsetLeft,w:b.offsetWidth};
}
function render(){
  const A=anim,D=dx;anim=false;dx=0;
  const d=day();
  document.documentElement.style.setProperty("--h",HUES[S.days.indexOf(d)%HUES.length]);
  app.innerHTML=mode==="today"?viewToday(d):viewEdit(d);
  app.style.setProperty("--dx",D);
  app.classList.toggle("enter",A);app.classList.toggle("side",A&&D!==0);
  if(A)app.querySelectorAll("[data-r]").forEach((el,k)=>el.style.setProperty("--i",k));
  bar.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
  thumb();
  if(mode==="today")requestAnimationFrame(()=>requestAnimationFrame(prog));
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,d=day(),L=d.exercises,i=L.findIndex(x=>x.id===id);
  anim=["mode","tab"].includes(a);if(a!=="tab")dx=0;
  if(a==="tog"){
    const c=S.checks[cur]||(S.checks[cur]={});
    if(c[id])delete c[id];else c[id]=true;
    if(!Object.keys(c).length)delete S.checks[cur];
    save();
    const on=!!(S.checks[cur]&&S.checks[cur][id]);
    b.classList.toggle("dn",on);b.setAttribute("aria-pressed",on);
    b.querySelector(".ck").classList.toggle("on",on);
    prog();return;
  }
  if(a==="mode"){mode=b.dataset.m;armDel=null}
  else if(a==="tab"){const o=S.days.indexOf(d),n=S.days.findIndex(x=>x.id===id);dx=n>o?1:n<o?-1:0;S.active=id;armDel=null}
  else if(a==="addday"){const n={id:uid(),name:"Giorno "+(S.days.length+1),exercises:[]};S.days.push(n);S.active=n.id}
  else if(a==="delday"){if(armDel===d.id){S.days=S.days.filter(x=>x.id!==d.id);S.active=S.days[0].id;armDel=null}else armDel=d.id}
  else if(a==="up"&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
  else if(a==="down"&&i>=0&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
  else if(a==="rm"&&i>=0)L.splice(i,1);
  else if(a==="add"){const n=document.getElementById("nn").value.trim();if(!n){document.getElementById("nn").focus();return}L.push(ex(n,document.getElementById("nd").value.trim()))}
  else if(a==="reset")delete S.checks[cur];
  else return;
  save();render();
});
app.addEventListener("input",e=>{
  const t=e.target;
  const f=t.dataset.f;if(!f)return;
  if(f==="dayname")day().name=t.value;
  else{const x=day().exercises.find(y=>y.id===t.dataset.id);if(x)x[f]=t.value}
  save();
});
let tx=0,ty=0;
app.addEventListener("touchstart",e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
app.addEventListener("touchend",e=>{
  if(e.target.closest("input,textarea,.seg"))return;
  const t=e.changedTouches[0],x=t.clientX-tx,y=t.clientY-ty;
  if(Math.abs(x)<60||Math.abs(x)<Math.abs(y)*1.5)return;
  const i=S.days.indexOf(day()),n=i+(x<0?1:-1);
  if(n<0||n>=S.days.length)return;
  dx=n>i?1:-1;S.active=S.days[n].id;armDel=null;anim=true;save();render();
},{passive:true});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
